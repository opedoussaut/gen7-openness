name: Verify and publish workshop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      # Preview of the decision-intelligence branch, published under /decision-intelligence/.
      # Additive only: the stable site at the root is built exactly as before, and a failure
      # in the preview never blocks it (continue-on-error).
      - name: Check out the decision-intelligence preview
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: decision-intelligence
          path: _preview
      - name: Test and build the preview under /decision-intelligence/
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        working-directory: _preview
        run: |
          npm test
          npm run build
          mv dist ../dist/decision-intelligence
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the workshop
        id: deployment
        uses: actions/deploy-pages@v4
